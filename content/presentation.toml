# FOV range is the note on controller.toml [camera] ("player-adjustable 75 to 110").
fov_min = 75.0
fov_max = 110.0
mouse_sensitivity = 0.0022
gamepad_look_deg_per_sec = 130.0
view_bob_hz = 8.5
pad_magnetism_blend = 0.45
pitch_limit_deg = 85.0

[hud.away]
slate = "ui_panel_slate"
text = "white"
bar = "teal"
count = "white"
count_outline = "ui_panel_slate"
count_outline_px = 4.0
count_shadow = "ui_panel_slate"
count_shadow_px = 14.0
count_shadow_soft_px = 8.0
count_shadow_alpha = 0.40
panel_opacity = 0.85
panel_width = 460.0
panel_height = 96.0
panel_top = 36.0
panel_pad = 18.0
title_px = 28.0
row_gap = 10.0
bar_height = 10.0
# Timer-bar track, as a fraction of the slate. This is the darkest the empty bar gets.
bar_track = 0.45
count_px = 180.0
count_scale_from = 1.45
count_scale_to = 0.8
away_desaturation = 0.6
away_dim = 0.3
music_duck_db = -12.0
music_duck_lowpass_hz = 800.0
# Dim minimum. The grade never multiplies a pixel darker than this.
dim_floor = 0.05
# ox/oy are fractions of count_shadow_soft_px, added to count_shadow_px. weight is the ink mix.
count_shadow_samples = [{ ox = 0.0, oy = 0.0, weight = 1.0 }, { ox = 0.5, oy = 0.0, weight = 0.45 }, { ox = -0.5, oy = 0.0, weight = 0.45 }, { ox = 0.0, oy = 0.5, weight = 0.45 }, { ox = 0.0, oy = -0.5, weight = 0.45 }, { ox = 0.5, oy = 0.5, weight = 0.45 }, { ox = -0.5, oy = 0.5, weight = 0.45 }, { ox = 0.5, oy = -0.5, weight = 0.45 }, { ox = -0.5, oy = -0.5, weight = 0.45 }]

[hud.away.coop]
text = "HOST AWAY"
show_timer = true

[hud.away.solo]
text = "PAUSED"
show_timer = false
