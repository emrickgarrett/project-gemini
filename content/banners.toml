id = "standard"

[rates]   # base rates, published in-game
common=0.60
rare=0.30
epic=0.085
legendary=0.015
[pity]
legendary_soft_start = 55       # +6% per pull from 55
legendary_soft_step = 0.06
legendary_hard = 70
epic_or_better_guarantee = 10   # every 10 pulls
carries_between_banners = true
[published]
legendary_overall_rate = 0.0255  # exact: expected 39.2 pulls per legendary under pity (computed, epic guarantee excluded)
[cost]
single = 100
pods = 10
# Required. This is 10x single. Loading fails when the key is missing.
ten_pull_cost = 1000

# Receipts kept with the save. Older keys are dropped so a save always loads.
[saved]
max_keys = 32

# Dev builds only. The backend grants this when its server-side dev flag is on.
# It does not change pity, rates, or which tier a pull can land on.
[dev]
starting_credits = 5000

# Pod awards. The server picks one item of the rolled rarity and sends its id.
# The client looks that id up here for the icon and the name. It does not choose.
# icon rows use '#' for `ink` and '.' for the paper face. `ink` is not a rarity color.
[[item]]
id = "visor"
name = "VISOR"
rarity = "common"
ink = "hero_plate"
icon = ["..####..", ".#....#.", ".######.", ".#....#.", "..#..#..", "...##..."]

[[item]]
id = "grip"
name = "GRIP"
rarity = "common"
ink = "hero_vex"
icon = ["...##...", "..####..", "...##...", "...##...", "..####..", "...##..."]

[[item]]
id = "core"
name = "CORE"
rarity = "rare"
ink = "trim_cyan"
icon = ["..####..", ".######.", "########", ".######.", "..####..", "...##..."]

[[item]]
id = "barrel"
name = "BARREL"
rarity = "rare"
ink = "hero_nyra"
icon = ["........", ".######.", ".#....#.", ".#....#.", ".######.", "........"]

[[item]]
id = "sight"
name = "SIGHT"
rarity = "epic"
ink = "hero_kip"
icon = ["##....##", ".#....#.", "..#..#..", "...##...", "..#..#..", ".#....#."]

[[item]]
id = "link"
name = "LINK"
rarity = "epic"
ink = "nest_brass"
icon = [".##..##.", "#..##..#", ".##..##.", ".##..##.", "#..##..#", ".##..##."]

[[item]]
id = "mark"
name = "MARK"
rarity = "legendary"
# Darker than key_warm so the icon reads on the paper face.
ink = "mark_ink"
icon = ["...##...", "...##...", ".######.", "...##...", "..#..#..", ".#....#."]

[[item]]
id = "perk"
