# Co-op rules (M2). Player-hosted; backend validates currency.
[lobby]
max_players = 8
min_players = 1

[join_in_progress]
allowed_during = "breather_only"     # joiners spawn at the next breather, never mid-wave
upgrade_catchup = "match_lowest"     # joiner gets as many run-upgrade picks as the squad's lowest player
catchup_pick_mode = "choose_from_3"  # each catch-up pick is a normal 1-of-3 offer
budget_rescale = "next_wave"         # waves.toml per_extra_player applies from the next wave start

[reconnect]
slot_hold_seconds = 90               # keep slot, hero and run upgrades
downed_on_return = false             # returns at full hp at the squad's location

[revive]
# revive_time from controller.toml, scaled by number of revivers
multi_reviver_speedup = 0.35         # each extra reviver adds +35% speed
max_extra_revivers = 2
bleedout_pause_while_reviving = true
squad_wipe = "all_downed"            # match ends when everyone is down at once

[currency_share]
# backend formula per player; no splitting between players
credit = "per_round_present"         # you earn a round's currency only for rounds you were in at its start
leave_keeps_earned = true            # already-credited rounds are kept
host_leave = "match_ends_rounds_kept"

[host_away]
# A hidden host tab freezes enemies, the wave timer, bleedout, and cooldowns
# after detect_after_seconds. Multiplayer ends at end_after_seconds of silence
# and keeps rounds the host already reported. Solo stays paused. Coming back
# plays a resume countdown, then the match continues from this frame only.
detect_after_seconds = 3.0
end_after_seconds = 60.0
resume_countdown_seconds = 3.0
# Silence left on the clock clears only after this much continuous live play.
away_timer_reset_after_play_seconds = 10.0
freeze = "everything"

[friendly_fire]
enabled = false
