# One clock per track. Do not add a global bpm.
# combat_01 and boss_brood are the measured stubs; theme_main is the
# earlier ~144 reading; boss_hive is an unmeasured placeholder with its
# own clock so it cannot inherit another track's tempo.

[director]
intensity_per_wave = 0.08
boss_intensity_bonus = 0.22
intensity_cap = 1.0
# File length vs bpm*beats*bars. Warn above this; never drive the clock from bpm.
bpm_warn_ms = 4.0

[director.difficulty_bias]
normal = 0.0
hard = 0.18
heroic = 0.40
legendary = 0.62

[track.theme_main]
bpm = 144
beats_per_bar = 4
loop_bars = 16
fade_bars = 1.0
role = "menu"
path = "audio/music/theme_main.ogg"

[track.combat_01]
bpm = 141.58
beats_per_bar = 4
loop_bars = 16
fade_bars = 1.0
role = "combat"

[[track.combat_01.layer]]
id = "drums"
path = "audio/music/combat_01/drums.ogg"
min_intensity = 0.0

[[track.combat_01.layer]]
id = "bass"
path = "audio/music/combat_01/bass.ogg"
min_intensity = 0.22

[[track.combat_01.layer]]
id = "synth"
path = "audio/music/combat_01/synth.ogg"
min_intensity = 0.48

[[track.combat_01.layer]]
id = "lead"
path = "audio/music/combat_01/lead.ogg"
min_intensity = 0.72

[track.boss_brood]
bpm = 137.67
beats_per_bar = 4
loop_bars = 16
fade_bars = 1.0
role = "boss"
boss_id = "brood_mother"
path = "audio/music/boss_brood.ogg"

# Placeholder until the hive cue is timed. Distinct from combat_01 and boss_brood.
[track.boss_hive]
bpm = 128
beats_per_bar = 4
loop_bars = 16
fade_bars = 1.0
role = "boss"
boss_id = "hive_tyrant"
path = "audio/music/boss_hive.ogg"

# combat↔boss is always a hard cut on a cue: boss roar going in, death sting
# coming out. Never a beat-matched crossfade, even if tempos are later edited
# to match. Crossfades are only legal between tracks that share a tempo, and
# only on a bar line of the track that is currently playing.
[transitions]
combat_to_boss = "hard_cut"
combat_to_boss_cue = "boss_roar"
boss_to_combat = "hard_cut"
boss_to_combat_cue = "death_sting"
menu_to_combat = "hard_cut"
menu_to_combat_cue = "match_start"
combat_to_menu = "hard_cut"
combat_to_menu_cue = "match_end"
same_tempo = "crossfade_on_bar"
different_tempo = "hard_cut"
