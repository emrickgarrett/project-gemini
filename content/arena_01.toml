# Arena 01. Origin = center of platform, +z = north, +x = east, meters. y = height.
size = [80, 80]
shape = "circle"
radius = 40
player_spawn = [0, 4.0, 0]

[platform]
center = [0, 0]
radius = 8
height = 4.0
railing_height = 0.6        # low, so 4 vents stay visible
ramps = [ { from = [8, 0], to = [16, 0], width = 4 }, { from = [-8, 0], to = [-16, 0], width = 4 } ]   # east + west chokepoints

[boss_area]
center = [0, -24]           # south, kept clear of boulders
radius = 12.5

