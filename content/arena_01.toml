[perch_rules]
perch_radius = 1.5                   # meters, horizontal. Detection, landing, fuel pause, and the climb trigger all use this squared.
perch_height_slack = 0.45           # meters of vertical slack for "standing on a perch". The 0.4 lip snap is [ledge_catch] snap, not this.
climb_trigger_distance = 1.8        # meters. A swarmer this close in XZ to the flow goal starts the anti-camp climb, and only inside perch_radius.
climb_slide_rate = 0.4              # fraction of the remaining XZ gap closed per second while climbing
flow_field_targets = "nearest_grounded_player"
all_perched_grace = 8.0          # seconds before anti-camp kicks in
climb_speed_mult = 0.5           # swarmers climb resin streaks
climb_clearance = 0.5             # meters kept inside the play edge while a swarmer climbs
ground_chase_pad = 0.5           # meters kept inside the play edge while a swarmer chases on the ground
budget_shift_to_spitters = 0.3   # extra share of wave budget to spitters while all perched
fuel_regen_on_perch = false      # boosting is still allowed; only regen pauses

# Host-away still floor. Colors are palette.toml keys.
[paint]
floor_light = "arena_light"
floor_dark = "arena_dark"
band_x = 48
band_y = 36
shade = 0.45

# Host-away still sky, above the horizon. `sky` is a palette.toml key.
# arena_sky is the old reveal_ink * [2, 5, 1] / [7, 12, 2] scale.
[edge_wash]
sky = "arena_sky"
horizon = 0.42
mix = 0.25
span = 0.45

# Scenery rules, lanes, and cover. Bounds, spawns, and jetpack ledges stay above.

[scenery]
min_hue_distance_deg = 24.0
min_saturation = 0.22
weakpoint = "spitter_glow"
overdrive = "hero_vex"
yellow = "hero_kip"
actor_base = ["swarmer_amber", "spitter_carapace", "brute_amber", "brood_sac", "hero_vex_primary", "hero_nyra_primary", "hero_brakk_primary", "hero_kip_primary"]
fog_start = 82.0
fog_end = 118.0
fog_max_density = 0.04
max_fog_at_attack = 0.0
max_clutter_height = 0.18
bounds_slack = 0.05
overlap_epsilon = 0.001
cover_tie = "x"
spawn_clearance = 2.5
clutter_kinds = ["rubble", "pebble", "crack", "vein", "beacon"]
outside_kinds = ["rim_rock", "flora_stalk", "flora_bulb"]
required_cameras = ["eye", "overhead", "concept", "vex"]
surface_kinds = ["dirt", "metal", "rock", "resin"]
luma_weights = [0.2126, 0.7152, 0.0722]
mover_height = 1.62
cover_solve_passes = 4
deck_shove_drop = 0.5
shove_rim_outset = 0.05
shove_center_epsilon = 0.001

