bank_earned = "EARNED"
bank_bonus = "BONUS"
bank_quit = "LEFT MATCH"
bank_disconnect = "DISCONNECTED"

[layout]
title_scale = 6
button_scale = 3
hint_scale = 2
border_px = 2.0
button_width = 420.0
button_height = 64.0
row_gap = 16.0
title_gap = 28.0
margin_x = 48.0
margin_y = 28.0
card_width = 280.0
card_height = 500.0
card_gap = 16.0
# Portrait height as a fraction of the card. It is centered in the top half, above the name.
portrait_fraction = 0.40
# Locked cards stay grayscale. Glowing portrait pixels mix this far back toward the accent.
locked_accent_mix = 0.35
# A pixel counts as the accent when its chroma and value clear these floors
# and its hue is within locked_hue_window degrees of the UI accent.
locked_accent_chroma = 18.0
locked_accent_value = 24.0
locked_hue_window = 20.0
# Non-accent portrait pixels desaturate this far on a locked card. 1 is fully gray.
locked_body_desaturation = 1.0
card_pad = 12.0
pause_keep = 0.60
# Upgrade cards fill with colors.panel at this alpha.
panel_alpha = 0.85
pause_panel_width = 480.0
pause_panel_height = 340.0
# Chunky pause panel. Radius, outline, and bevel are 720p pixels.
panel_radius = 22.0
button_radius = 16.0
bevel_px = 8.0
pause_outline_px = 6.0
# Co-op pause veil. The live match stays visible under this alpha.
coop_pause_dim = 0.55
slider_width = 360.0
slider_height = 18.0
settings_row_height = 52.0
# Minus and plus buttons. stepper_min_px is a screen-pixel floor after scaling.
# The button side is at most the row width divided by stepper_width_divisor.
# The border thickness is that side divided by stepper_border_divisor.
stepper_min_px = 8.0
stepper_width_divisor = 5
stepper_border_divisor = 8
stat_decimals = 1
mult_decimals = 1
currency_decimals = 0
nav_repeat_secs = 0.18
stick_deadzone = 0.45
# Focused borders mix this far toward the paper color so the highlight reads without a mouse.
focus_lift = 0.45
# Reference frame the fit check uses. Labels are not scaled down to pass it.
# The painter multiplies every layout size by window height / fit_height.
fit_width = 1280.0
fit_height = 720.0
# Wrapped-text leading, stacked-line spacing, and control insets. 720p pixels.
# Loading rejects a missing or negative value. inset_min is the border floor in screen pixels.
leading = 2.0
spacing = 4.0
spacing_role = 6.0
spacing_block = 8.0
inset_x = 12.0
inset_y = 6.0
inset_bar = 8.0
inset_portrait = 4.0
inset_min = 1.0
bank_panel_width = 760.0
bank_panel_height = 620.0

# Hero-card portrait framing. bg is a palette.toml key. The FOV search starts at
# max(viewmodel fov, fov_floor) and steps until every vertex is inside that hero's portrait.fit.
[portrait]
bg = "portrait_field"
raster = 320
fov_floor = 10.0
fov_limit = 150.0
fov_step = 4.0
near = 0.08

[settings]
sensitivity = 1.0
sensitivity_min = 0.25
sensitivity_max = 4.0
sensitivity_step = 0.05
fov = 90.0
fov_min = 70.0
fov_max = 110.0
fov_step = 1.0
invert_y = false
view_bob = true
master = 0.8
music = 0.6
effects = 0.8
volume_min = 0.0
volume_max = 1.0
volume_step = 0.05
default_difficulty = "normal"
settings_file = "gemini-settings.toml"
settings_key = "gemini-settings"
# Playtest only. Unlocks hero selection on this client. Does not grant ownership, currency, or crates.
unlock_all = false

[sounds]
hover = "ui_hover"
confirm = "ui_confirm"
back = "ui_back"
error = "ui_error"
slider = "ui_slider_tick"
toggle = "ui_toggle"
pause_open = "pause_open"
pause_close = "pause_close"
match_start = "match_start"
victory = "results_victory"
defeat = "results_defeat"
count_tick = "ui_count_tick"
bank_chime = "ui_bank_chime"

[bank]
# Count-up length, and the gap between UI ticks. The bank chime plays once at count_secs.
count_secs = 1.0
count_tick_secs = 0.05
