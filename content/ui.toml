waves = "WAVES"
kills = "KILLS"
time = "TIME"
currency = "CURRENCY"
victory = "VICTORY"
defeat = "DEFEAT"
sensitivity = "SENSITIVITY"
fov = "FOV"
view_bob = "VIEW BOB"
invert_y = "INVERT Y"
master = "MASTER"
music = "MUSIC"
effects = "EFFECTS"
on = "ON"
off = "OFF"
reset_notice = "SETTINGS RESET"
crates_title = "CRATES"
crates_empty = "NO CRATE YET"
crates_pull = "PULL"
crates_ten = "TEN PULL"
crates_open = "OPEN"
crates_continue = "CONTINUE"
crates_pull_again = "PULL AGAIN"
crates_retry = "RETRY"
crates_show_last = "SHOW LAST PULL"
pull_failed = "PULL FAILED · NO CREDITS SPENT"
connection_lost = "CONNECTION LOST, RETRY"
last_pull_confirmed = "LAST PULL CONFIRMED"
pull_need = "NEED"
pull_more = "MORE"
pull_have = "HAVE"
pull_credits = "CREDITS"
