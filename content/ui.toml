# Menu, pause, settings, and results. Every size and color lives here.
# Colors are palette.toml keys. The pixel font and glyph_rows live in crate_reveal.toml.
# Loading fails when a key is missing, a color does not resolve, or a label does not fit 1280x720.

[colors]
panel = "ui_panel_slate"
text = "reveal_paper"
dim = "reveal_ink"
stage = "reveal_stage"
focus_before_hero = "rarity_common"
victory = "rarity_legendary"
defeat = "spitter_glow"
locked = "reveal_ink"
# Every line on a locked card, including the HP/SPD line.
locked_text = "rarity_common"

[copy]
title = "PROJECT GEMINI"
play = "PLAY"
crates = "CRATES"
settings = "SETTINGS"
quit = "QUIT"
back = "BACK"
resume = "RESUME"
quit_to_menu = "QUIT TO MENU"
play_again = "PLAY AGAIN"
main_menu = "MAIN MENU"
click_to_play = "CLICK TO PLAY"
host = "HOST"
join = "JOIN"
coming_soon = "COMING SOON"
heroes = "CHOOSE A HERO"
difficulty = "CHOOSE A DIFFICULTY"
locked = "LOCKED"
hp = "HP"
speed = "SPD"
dmg = "DMG"
power = "POWER"
waves = "WAVES"
kills = "KILLS"
time = "TIME"
currency = "CURRENCY"
victory = "VICTORY"
defeat = "DEFEAT"
sensitivity = "SENSITIVITY"
fov = "FOV"
view_bob = "VIEW BOB"
invert_y = "INVERT Y"
master = "MASTER"
music = "MUSIC"
effects = "EFFECTS"
on = "ON"
off = "OFF"
reset_notice = "SETTINGS RESET"
crates_title = "CRATES"
crates_empty = "NO CRATE YET"
crates_pull = "PULL"
crates_open = "OPEN"
pull_failed = "PULL FAILED"

[layout]
title_scale = 6
button_scale = 3
hint_scale = 2
border_px = 2.0
button_width = 420.0
button_height = 64.0
row_gap = 16.0
title_gap = 28.0
margin_x = 48.0
margin_y = 28.0
card_width = 280.0
card_height = 500.0
card_gap = 16.0
# Portrait height as a fraction of the card. It is centered in the top half, above the name.
portrait_fraction = 0.40
card_pad = 12.0
pause_keep = 0.60
pause_panel_width = 480.0
pause_panel_height = 340.0
slider_width = 360.0
slider_height = 18.0
settings_row_height = 52.0
stat_decimals = 1
mult_decimals = 1
currency_decimals = 0
nav_repeat_secs = 0.18
stick_deadzone = 0.45
# Focused borders mix this far toward the paper color so the highlight reads without a mouse.
focus_lift = 0.45
# Reference frame the fit check uses. Labels are not scaled down to pass it.
# The painter multiplies every layout size by window height / fit_height.
fit_width = 1280.0
fit_height = 720.0

[settings]
sensitivity = 1.0
sensitivity_min = 0.25
sensitivity_max = 4.0
sensitivity_step = 0.05
fov = 90.0
fov_min = 70.0
fov_max = 110.0
fov_step = 1.0
invert_y = false
view_bob = true
master = 0.8
music = 0.6
effects = 0.8
volume_min = 0.0
volume_max = 1.0
volume_step = 0.05
default_difficulty = "normal"
settings_file = "gemini-settings.toml"
settings_key = "gemini-settings"
# Playtest only. Unlocks hero selection on this client. Does not grant ownership, currency, or crates.
unlock_all = false

[sounds]
hover = "ui_hover"
confirm = "ui_confirm"
back = "ui_back"
error = "ui_error"
slider = "ui_slider_tick"
toggle = "ui_toggle"
pause_open = "pause_open"
pause_close = "pause_close"
match_start = "match_start"
victory = "results_victory"
defeat = "results_defeat"
