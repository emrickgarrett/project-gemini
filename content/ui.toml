# Menu, pause, settings, and results. Every size and color lives here.
# Colors are palette.toml keys. The pixel font and glyph_rows live in crate_reveal.toml.
# Loading fails when a key is missing, a color does not resolve, or a label does not fit 1280x720.

[colors]
panel = "ui_panel_slate"
text = "reveal_paper"
dim = "reveal_ink"
stage = "reveal_stage"
focus_before_hero = "rarity_common"
# Win title and outline. Legendary gold stays on the crate reveal and legendary cards.
victory = "victory"
# Loss title and outline. Bug magenta stays on enemies.
defeat = "hero_brakk"
locked = "reveal_ink"
# Every line on a locked card, including the HP/SPD line.
locked_text = "rarity_common"
bevel_light = "reveal_paper"
bevel_shadow = "reveal_ink"
veil = "reveal_ink"
# Count-up digits. Legendary gold stays on the crate reveal.
bank_count = "reveal_paper"
bank_bonus = "reveal_paper"

[copy]
title = "PROJECT GEMINI"
play = "PLAY"
crates = "CRATES"
settings = "SETTINGS"
quit = "QUIT"
back = "BACK"
resume = "RESUME"
quit_to_menu = "QUIT TO MENU"
play_again = "PLAY AGAIN"
main_menu = "MAIN MENU"
