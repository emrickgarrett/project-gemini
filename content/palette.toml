# Art-lead palette. Read these in the client; do not duplicate the hex values in code.
# Names reserved for bugs. UI and heroes may not resolve to any of these hexes.
bug_owned = [
  "swarmer.shell",
  "swarmer.glow",
  "spitter.carapace",
  "spitter.glow",
  "brute.shell",
  "brute.cracks",
  "bugs.acid",
  "bugs.amber",
  "bugs.magenta",
  "swarmer_amber",
  "brute_amber",
  "swarmer_glow",
  "bud_glow",
  "spitter_carapace",
  "spitter_glow",
  "brute_cracks",
]

[hero]
teal = "#1FB5A8"
cobalt = "#1E40AF"
white = "#F2F2F2"

[shots]
player = "#2DE1D0"

[swarmer]
shell = "#C67A2E"
glow = "#7CFF3A"

[spitter]
carapace = "#4A3540"
glow = "#FF2BD6"

[brute]
shell = "#C67A2E"
cracks = "#FF2BD6"

[arena]
rock_dark = "#6E6478"
rock_light = "#8A8296"

[rarity]
common = "#C0C7D0"
rare = "#3B82F6"
epic = "#A855F7"
legendary = "#FACC15"

[bugs]
acid = "#7CFF3A"
amber = "#C67A2E"
magenta = "#FF2BD6"

# Flat keys the bug visual table addresses by name.
[keys]
swarmer_amber = "#C67A2E"
swarmer_glow = "#7CFF3A"
spitter_carapace = "#4A3540"
spitter_glow = "#FF2BD6"
brute_amber = "#C67A2E"
brute_cracks = "#FF2BD6"
brood_sac = "#5A6B2A"
bud_glow = "#7CFF3A"
ui_panel_slate = "#334155"
reveal_stage = "#120E17"
reveal_ink = "#1C1820"
reveal_paper = "#F2F2F2"
# Win title and panel outline. Same family as shots.player. Not legendary gold.
victory = "#2DE1D0"
# UI accents only. Casts do not tint with these keys.
hero_vex = "#F97316"
hero_nyra = "#7DD3FC"
hero_brakk = "#DC2626"
hero_kip = "#FDE047"
# Spitter rim. The carapace is too dark against arena_sky without it.
spitter_rim = "#E6D3C2"
# Brakk's plates. hero_cobalt shades to near-black on a lit facet.
hero_plate = "#5B8DEF"
# Menu portrait field. The viewmodel raster treats this grey as empty.
portrait_field = "#8A8A8A"
# Host-away sky. reveal_ink scaled by [2, 5, 1] / [7, 12, 2] is these bytes.
arena_sky = "#080A10"

# Channel colors measured from the Meshy textures (masks_v2).
# R primary, G secondary, B accent, A fourth color.
# Emissive is the `emissive` field. A name ending in _glow is not a glow.
