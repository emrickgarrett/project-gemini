# Art-lead palette. Read these in the client; do not duplicate the hex values in code.

[hero]
teal = "#1FB5A8"
cobalt = "#1E40AF"
white = "#F2F2F2"

[shots]
player = "#2DE1D0"

[swarmer]
shell = "#C67A2E"
glow = "#7CFF3A"

[spitter]
carapace = "#4A3540"
glow = "#FF2BD6"

[brute]
shell = "#C67A2E"
cracks = "#FF2BD6"

[arena]
rock_dark = "#6E6478"
rock_light = "#8A8296"

[rarity]
common = "#C0C7D0"
rare = "#3B82F6"
epic = "#A855F7"
legendary = "#FACC15"

[bugs]
acid = "#7CFF3A"
amber = "#C67A2E"
magenta = "#FF2BD6"

# Flat keys the bug visual table addresses by name.
[keys]
swarmer_amber = "#C67A2E"
swarmer_glow = "#7CFF3A"
spitter_carapace = "#4A3540"
spitter_glow = "#FF2BD6"
brute_amber = "#C67A2E"
brute_cracks = "#FF2BD6"
brood_sac = "#5A6B2A"
bud_glow = "#7CFF3A"
ui_panel_slate = "#334155"
reveal_stage = "#120E17"
reveal_ink = "#1C1820"
reveal_paper = "#F2F2F2"
# UI accents only. Casts do not tint with these keys.
hero_vex = "#F97316"
hero_nyra = "#7DD3FC"
hero_brakk = "#DC2626"
hero_kip = "#FDE047"
# Kept for older rows. The channel tint does not multiply by these.
hero_vex_base = "#6B3010"
hero_nyra_base = "#163E52"
hero_brakk_base = "#6E1212"
hero_kip_base = "#6A5810"
# Spitter rim. The carapace is too dark against arena_sky without it.
spitter_rim = "#E6D3C2"
# Brakk's plates. hero_cobalt shades to near-black on a lit facet.
hero_plate = "#5B8DEF"
# Menu portrait field. The viewmodel raster treats this grey as empty.
portrait_field = "#8A8A8A"
# Host-away sky. reveal_ink scaled by [2, 5, 1] / [7, 12, 2] is these bytes.
arena_sky = "#080A10"

# Channel colors measured from the Meshy textures (masks_v2).
# R primary, G secondary, B accent, A fourth color.
# Emissive is the `emissive` field. A name ending in _glow is not a glow.
hero_vex_primary = "#127587"
hero_vex_secondary = "#132848"
hero_vex_accent = "#F97316"
hero_vex_glow = "#715439"
hero_nyra_primary = "#D9DADB"
hero_nyra_secondary = "#0C4580"
hero_nyra_accent = "#3C89CF"
hero_nyra_glow = "#182F4E"
hero_brakk_primary = "#9A1B28"
hero_brakk_secondary = "#0F2D49"
hero_brakk_accent = "#9D1C29"
hero_brakk_glow = "#3A1E2F"
hero_kip_primary = "#124877"
hero_kip_secondary = "#DDD9D6"
hero_kip_accent = "#E1AE27"
hero_kip_glow = "#324145"
gear_vex_gun_primary = "#262929"
gear_vex_gun_secondary = "#0C7984"
gear_vex_gun_accent = "#F18619"
gear_nyra_gun_primary = "#D9DBDD"
gear_nyra_gun_secondary = "#0C5898"
gear_nyra_gun_accent = "#1C93CF"
gear_nyra_gun_glow = { hex = "#62E3F7", emissive = true }
gear_brakk_gun_primary = "#191B1B"
