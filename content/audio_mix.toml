# Mixer policy. These sit beside the per-file rows. Critical cues ignore the voice cap.
# Warning rows do not. Each warning row keeps its own max_instances.
# Loading fails when warning max_instances + crowd loops + hit_reserve exceed voice_cap.
voice_cap = 32
crowd_radius = 30.0
crowd_full_count = 18
min_distance = 0.5
hit_reserve = 3
# Seconds a replaced warning voice fades out. The newcomer waits for that fade
# to free the row slot. Nearest-wins stays inside one warning row.
# A warning that needs a voice when none are free fades the lowest-priority
# stealable voice (then the farthest, then the voice id) and waits the same way.
# Stealable prop loops count in the live cap and can be taken. The bed and the
# crowd loop are not stealable, so they are never that voice.
# A stolen loop waits. The next free voice resumes the loop nearest the listener.
# Equal distance keeps the lower voice id. Playback seeks to the loop position
# it had reached and fades in over loop_resume_fade.
# The crowd loop is reserved every frame, whether or not swarmers are near.
warning_fade = 0.030
loop_resume_fade = 0.3
critical = ["spitter_charge", "player_downed", "wave_start", "brood_roar", "tyrant_roar"]
# UI bus cues. They do not take a voice_cap slot.
outside_voice_cap = ["ui_count_tick", "ui_bank_chime", "crate_flip"]

# Sim event ids that name a file. An id the game can emit must be a row or an alias.
[alias]
hit = "acid_impact"
hurt = "player_hurt"
downed = "player_downed"
pickup = "pickup"
wave = "wave_start"
dash = "jetpack_boost"
swarmer_crowd = "swarmer_crowd_loop"
spitter_fire = "spitter_spit"
swarmer_footstep = "swarmer_click_01"
brute_footstep = "brute_step_01"
brute_attack = "brute_grunt"
tyrant_attack = "tyrant_scythe_swipe"
weakpoint_hit = "weakpoint_hit"


# Player steps. `rows` are mix ids. Timing uses stride / horizontal speed.
# remote_priority is teammates. Own steps use each row's priority.
[footstep]
stride = 1.8
min_speed = 0.45
remote_priority = 60
max_voices = 6

[footstep.rows]
dirt = ["step_dirt_1", "step_dirt_2", "step_dirt_3", "step_dirt_4"]
metal = ["step_metal_1", "step_metal_2", "step_metal_3", "step_metal_4"]
rock = ["step_rock_1", "step_rock_2", "step_rock_3", "step_rock_4"]
resin = ["step_resin_1", "step_resin_2", "step_resin_3", "step_resin_4"]

# Crate stings. The file lives under audio/stings/, so path is explicit.
# volume_db is required; a sting row without it fails content load.
# pitch, instance cap, loop, and category follow the other crate rows.
[sting.crate_common]
path = "audio/stings/crate_common.ogg"
volume_db = -4.0
pitch_rand_semitones = 0
max_instances = 1
loop = false
category = "ui_meta"
[sting.crate_rare]
path = "audio/stings/crate_rare.ogg"
volume_db = -4.0
pitch_rand_semitones = 0
max_instances = 1
loop = false
category = "ui_meta"
[sting.crate_epic]
path = "audio/stings/crate_epic.ogg"
volume_db = -4.0
pitch_rand_semitones = 0
max_instances = 1
loop = false
category = "ui_meta"
[sting.crate_legendary]
