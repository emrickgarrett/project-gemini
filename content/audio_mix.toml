volume_db = -2.0
pitch_rand_semitones = 0
max_instances = 1
loop = false
category = "ui_meta"

# Project Gemini SFX mix table. One [table] per file in audio/sfx/ (key = file name without .ogg).
# volume_db            gain applied on playback, dB relative to the file (files are all peak-normalized to -2 dBFS).
#                      Derived from each file's max 100 ms RMS (hp 60 Hz) toward a per-category target level
#                      (boss roars/deaths loudest, weapons/UI clear, swarmer clicks/crowd bed quietest), clamped to [-18, +2].
# pitch_rand_semitones  +/- random pitch per play (0 = fixed; UI and timed telegraphs stay fixed).
# max_instances        concurrent voices of this sound. A warning row never takes another row's voice.
#                      Inside one warning row, a closer new instance replaces the farthest
#                      and that voice fades for warning_fade. A farther one stays silent.
#                      Other rows: extra plays steal the oldest. All count toward voice_cap.
# loop                 true = seamless loop, play until stopped.
# stealable            required on every row. Loading names a row that omits it.
# flat                 required. true = not positioned in the world.
# category / measured_rms_db are informational. Placeholder levels: tune by ear.

[acid_impact]
volume_db = 0.4
pitch_rand_semitones = 0.5
max_instances = 4
loop = false
category = "enemy"
priority = 80
stealable = true
flat = false
measured_rms_db = -14.4

