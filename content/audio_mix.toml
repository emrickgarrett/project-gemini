# Mixer policy. These sit beside the per-file rows. Critical cues ignore the voice cap.
voice_cap = 32
crowd_radius = 30.0
crowd_full_count = 18
min_distance = 0.5
critical = ["spitter_charge", "player_downed", "wave_start", "brood_roar", "tyrant_roar"]

# Sim event ids that name a file. Unlisted events stay silent.
[alias]
hit = "acid_impact"
hurt = "player_hurt"
downed = "player_downed"
pickup = "pickup"
wave = "wave_start"
dash = "jetpack_boost"
swarmer_crowd = "swarmer_crowd_loop"
spitter_fire = "spitter_spit"
swarmer_footstep = "swarmer_click_01"
brute_footstep = "brute_step_01"
brute_attack = "brute_grunt"
tyrant_attack = "tyrant_scythe_swipe"
weakpoint_hit = "weakpoint_hit"

# Crate stings. The file lives under audio/stings/, so path is explicit.
# volume_db is required; a sting row without it fails content load.
# pitch, instance cap, loop, and category follow the other crate rows.
[sting.crate_common]
path = "audio/stings/crate_common.ogg"
volume_db = -4.0
pitch_rand_semitones = 0
max_instances = 1
loop = false
category = "ui_meta"
[sting.crate_rare]
path = "audio/stings/crate_rare.ogg"
volume_db = -4.0
pitch_rand_semitones = 0
max_instances = 1
loop = false
category = "ui_meta"
[sting.crate_epic]
path = "audio/stings/crate_epic.ogg"
volume_db = -4.0
pitch_rand_semitones = 0
max_instances = 1
loop = false
category = "ui_meta"
[sting.crate_legendary]
path = "audio/stings/crate_legendary.ogg"
volume_db = -2.0
pitch_rand_semitones = 0
max_instances = 1
loop = false
category = "ui_meta"

# Project Gemini SFX mix table. One [table] per file in audio/sfx/ (key = file name without .ogg).
# volume_db            gain applied on playback, dB relative to the file (files are all peak-normalized to -2 dBFS).
#                      Derived from each file's max 100 ms RMS (hp 60 Hz) toward a per-category target level
#                      (boss roars/deaths loudest, weapons/UI clear, swarmer clicks/crowd bed quietest), clamped to [-18, +2].
# pitch_rand_semitones  +/- random pitch per play (0 = fixed; UI and timed telegraphs stay fixed).
# max_instances        concurrent voices of this sound; extra plays steal the oldest (all count toward the global 32-voice cap).
# loop                 true = seamless loop, play until stopped.
# category / measured_rms_db are informational. Placeholder levels: tune by ear.

[acid_impact]
volume_db = 0.4
pitch_rand_semitones = 0.5
max_instances = 4
loop = false
category = "enemy"
