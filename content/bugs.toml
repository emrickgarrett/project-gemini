weakpoint = { name = "gland", shape = "sphere", radius = 0.5, offset = [0, 1.4, 1.8] }
pod = { shape = "sphere", radius = 0.35 }

[[brood_mother.hitbox.pods]]
offset = [1.15, 2.55, -0.15]
[[brood_mother.hitbox.pods]]
offset = [-1.15, 2.55, -0.15]
[[brood_mother.hitbox.pods]]
offset = [0.7, 2.85, -0.85]
[[brood_mother.hitbox.pods]]
offset = [-0.7, 2.85, -0.85]
[[brood_mother.hitbox.pods]]
offset = [0.0, 2.4, 0.35]
[[brood_mother.hitbox.pods]]
offset = [0.0, 3.05, -1.35]

[brood_mother.audio]
footstep = "brood_footstep"
attack = "brood_attack"

[hive_tyrant.visual]
