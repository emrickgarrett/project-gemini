# One table per bug. `visual` is the art-lead placement guide (proportions, anchors,
# what glows, gait). The mesh refines those anchors; it is not a hit volume.
# `hitbox` is the designer volume. Gameplay never reads the mesh.
# `audio` names the events. Mix levels live in audio.toml, not in code.
#
# Design "phase 1" is the first phase (sim phase index 0, above the first
# threshold). Weak-point centers come from the named visual part. The offset
# on a hitbox is only the fallback when that part has no anchor. The hive
# cannon follows the visual part named "cannon" (phase_max = 1).

[feedback]
weakpoint_hit = "weakpoint_hit"

[swarmer.visual]
height = 0.45
lod_distance = 18.0
parts = [
  { name="shell",   shape="sphere",  size=[0.45,0.30,0.55], offset=[0,0.28,0],    color="swarmer_amber" },
  { name="abdomen", shape="sphere",  size=[0.32,0.26,0.32], offset=[0,0.26,-0.28],color="swarmer_glow", emissive=true },
  { name="mandible",shape="cone",    size=[0.05,0.16],      offset=[0.08,0.22,0.30], color="swarmer_amber", mirror=true },
  { name="leg",     shape="capsule", size=[0.03,0.30],      count=6, ring_radius=0.25, color="swarmer_amber" },
]
anim = { bob=[0.03, 9.0], leg_swing=35, gait="tripod", glow_pulse=2.0 }

[swarmer.hitbox]
body = { shape = "sphere", radius = 0.35, offset = [0, 0.3, 0] }
weakpoint = { name = "abdomen", shape = "sphere", radius = 0.15, offset = [0, 0.35, -0.25], mult = 1.5 }

[swarmer.audio]
footstep = "swarmer_footstep"

[spitter.visual]
height = 1.3
lod_distance = 28.0
parts = [
  { name="thorax", shape="capsule", size=[0.25,0.9], offset=[0,0.75,0.1], tilt_deg=-35, color="spitter_carapace" },
  { name="head",   shape="cone",    size=[0.18,0.30], offset=[0,0.55,0.55], color="spitter_carapace" },
  { name="eyes",   shape="sphere",  size=[0.05,0.05,0.05], offset=[0.07,0.6,0.62], color="spitter_glow", emissive=true, mirror=true },
  { name="sac",    shape="sphere",  size=[0.55,0.55,0.60], offset=[0,1.05,-0.25], color="spitter_glow", emissive=true },
  { name="leg",    shape="capsule", size=[0.05,0.75], count=4, ring_radius=0.45, color="spitter_carapace" },
]
anim = { bob=[0.04, 3.0], leg_swing=25, gait="alternate", sac_charge_scale=1.25, sac_charge_glow=3.0 }

[spitter.hitbox]
body = { shape = "capsule", radius = 0.4, height = 1.4, offset = [0, 0.8, 0] }
weakpoint = { name = "sac", shape = "sphere", radius = 0.32, offset = [0, 1.3, -0.3], mult = 2.0, grows_during_charge = 1.25 }
sac_pop_cancels_shot = true
charge_seconds = 1.0

[spitter.audio]
footstep = "spitter_footstep"
charge = "spitter_charge"
fire = "spitter_fire"
sac_pop = "spitter_sac_pop"

[brute.visual]
height = 1.8
lod_distance = 34.0
parts = [
  { name="shell",    shape="sphere",  size=[1.6,1.2,2.0], offset=[0,1.0,0], color="brute_amber" },
  { name="cracks",   shape="decal",   on="shell", color="brute_cracks", emissive=true, active_when="vulnerable" },
  { name="horn",     shape="cone",    size=[0.25,0.7], offset=[0,1.3,1.0], tilt_deg=40, color="brute_amber" },
  { name="forelimb", shape="capsule", size=[0.22,1.0], offset=[0.7,0.6,0.8], color="brute_amber", mirror=true },
  { name="leg",      shape="capsule", size=[0.16,0.8], count=4, ring_radius=0.75, color="brute_amber" },
]
anim = { bob=[0.06, 1.4], leg_swing=20, gait="alternate", charge_lean_deg=12 }

[brute.hitbox]
body = { shape = "box", half_extents = [0.8, 0.9, 1.1], offset = [0, 0.9, 0] }
weakpoint = { name = "cracks", shape = "box", half_extents = [0.5, 0.3, 0.4], offset = [0, 1.6, -0.3], mult = 2.5, active_only_when = "vulnerable" }
armor_mult_when_closed = 0.5
vulnerable_after_charge = 2.0

[brute.audio]
footstep = "brute_footstep"
attack = "brute_attack"
shell_open = "brute_shell_open"

[brood_mother.visual]
height = 3.0
lod_distance = 48.0
bud_color = "brood_sac"
grown_color = "swarmer_glow"
parts = [
  { name="head",    shape="sphere",  size=[1.0,0.8,1.0], offset=[0,1.3,1.6], color="brute_amber" },
  { name="crown",   shape="cone",    size=[0.15,0.5], count=5, on="head", color="brute_amber" },
  { name="gland",   shape="sphere",  size=[0.5,0.45,0.4], offset=[0,0.9,2.0], color="spitter_glow", emissive=true },
  { name="sac",     shape="sphere",  size=[3.0,2.4,3.4], offset=[0,1.8,-0.6], color="brood_sac" },
  { name="pod",     shape="sphere",  size=[0.6,0.6,0.6], count=6, on="sac", color="swarmer_glow", emissive=true },
  { name="bud",     shape="sphere",  size=[0.25,0.25,0.25], count=6, on="sac", color="brood_sac", emissive=false, grows_into_pod_on="enrage" },
  { name="leg",     shape="capsule", size=[0.25,1.6], count=6, ring_radius=1.6, color="brute_amber" },
]
