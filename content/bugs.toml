# One file. `visual` places the mesh (part type, proportions, cameras, density, gait).
# There is no bugs_visual.toml. `hitbox` is the designer volume.
# A weak-point hitbox names a part in this file's [*.visual] tables (`anchor`,
# or `name` when `anchor` is empty). Loading fails when that name is missing
# or does not resolve. Gameplay never reads the mesh.
# `audio` names the events. Mix levels live in audio_mix.toml.
#
# Design "phase 1" is the first phase (sim phase index 0, above the first
# threshold). The hive cannon follows the visual part named "cannon"
# (phase_max = 1). The tail entry owns the chain pitch, joint, and segment cap.

[feedback]
weakpoint_hit = "weakpoint_hit"

[swarmer.visual]
height = 0.45
lod_distance = 18.0
parts = [
  { name="shell",    part="shell",    shape="sphere",  size=[0.42,0.40,0.46], offset=[0,0.30,0],     color="swarmer_amber", rear_open=true },
  { name="abdomen",  part="gem",      shape="sphere",  size=[0.22,0.22,0.22], offset=[0,0.22,-0.16], color="swarmer_glow", emissive=true },
  { name="mandible", part="mandible", shape="cone",    size=[0.05,0.16],      offset=[0.08,0.22,0.30], color="swarmer_amber", mirror=true, yaw=0.55, pitch=0.25, swing_hz=8.0, swing_amp=0.55 },
  { name="leg",      part="leg",      shape="capsule", size=[0.03,0.30],      count=6, ring_radius=0.25, color="swarmer_amber", hip=0.36, femur=0.46, femur_lod=0.92, tibia=0.40, foot=0.16 },
]
anim = { bob=[0.03, 9.0], leg_swing=35, gait="tripod", glow_pulse=2.0 }

[swarmer.visual.camera]
dist_mul = 2.35
dist_add = 0.9
eye_x = 0.55
eye_y = 1.05
eye_y_add = 0.12
eye_z = -1.15
look_y = 0.42
look_z = -0.08
fov = 30

[swarmer.visual.density]
slices = 5
stacks = 3
plates = 4
nu = 2
nv = 2
sides = 4
segs = 2
spines = 0

[swarmer.visual.lod]
slices = 4
stacks = 2
plates = 0
nu = 1
nv = 1
sides = 4
segs = 1
spines = 0

[swarmer.hitbox]
body = { shape = "sphere", radius = 0.35, offset = [0, 0.3, 0] }
weakpoint = { name = "abdomen", anchor = "abdomen", shape = "sphere", radius = 0.15, mult = 1.5 }

[swarmer.audio]
footstep = "swarmer_footstep"

