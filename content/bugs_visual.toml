# Meshy bug casts. Hitboxes and weak points stay in bugs.toml.
# `file` is under assets/. A missing or unknown file fails at load.
# `triangles` and `bytes` are the budgets. `fit = "hitbox"` scales the mesh
# into that bug's body hitbox. Colors are palette.toml keys.
# Red in the mask uses `accent` (magenta). Green uses `glow` (acid, emissive).

[[model]]
id = "swarmer"
file = "models/swarmer.glb"
triangles = 7200
bytes = 1100000
source = "Meshy"
license = "Generated from Gorkasso's concepts"
task = "not-in-handoff"
base = "swarmer_amber"
accent = "spitter_glow"
glow = "swarmer_glow"
rim = ""
fit = "hitbox"
size = 0.0
yaw_deg = 0.0
at = [0.0, 0.0, 0.0]
grip = [0.0, 0.0, 0.0]
view = [0.0, 0.0, 0.0]

