# Crate reveal visual timeline (seconds). Visual burst = sting hit time.
# The backend result is known before the drop. A fake-out may flicker at most one tier
# above the real one and must settle on the real tier. Skip jumps to the reveal card at any time.

# Global switch. Turn off for any paid crate. The backend logs each pull's fake-out decision.
fakeout_enabled = true
fakeout_sfx = "sfx/crate_fakeout.ogg"
burst_fade = 0.2                 # seconds the burst wash takes to fade
freeze_dim = 0.62                # legendary freeze multiplies the frame by 1 - this

[layout]
panel_width = 420.0
panel_height = 240.0
title_px = 42.0
hint_px = 16.0
glyph_rows = 7
row_gap = 16.0
ink_luma = 0.62
title_pad_px = 8
title_glyph_px = 6
title_height_div = 16
title_scale_min = 2
title_scale_max = 14
border_px = 8
border_mix = 0.42
gem_height = 0.30
gem_glow = 0.72
divider_px = 2
stage = "reveal_stage"
ink_dark = "reveal_ink"
ink_light = "reveal_paper"
# Still backdrop, in bytes: palette(stage) + stage_base + lift * center - vignette * corner.
stage_base = [-2.0, -2.0, -1.0]
stage_lift = [28.0, 22.0, 36.0]
stage_vignette = [10.0, 8.0, 12.0]

[common]
tease = "sfx/crate_tease.ogg"
sting = "stings/crate_common.ogg"
drop = [0.0, 2.0]
crack = [2.0, 3.5]
burst = 3.5
rise = [3.6, 4.2]
card = 4.2
fakeout_allowed = false
fakeout_chance = 0.0
fakeout_window = [2.6, 3.0]

[rare]
tease = "sfx/crate_tease.ogg"
sting = "stings/crate_rare.ogg"
drop = [0.0, 2.0]
crack = [2.0, 3.5]
burst = 3.5
rise = [3.6, 5.0]
card = 5.0
fakeout_allowed = true
fakeout_chance = 0.15
fakeout_window = [2.6, 3.0]

[epic]
tease = "sfx/crate_tease.ogg"
sting = "stings/crate_epic.ogg"
drop = [0.0, 2.0]
crack = [2.0, 3.5]
burst = 3.5
rise = [3.6, 5.3]
card = 5.3
fakeout_allowed = true
fakeout_chance = 0.2
fakeout_window = [2.6, 3.0]

[legendary]
tease = "sfx/crate_tease_legendary.ogg"
sting = "stings/crate_legendary.ogg"
drop = [0.0, 2.0]
crack = [2.0, 3.5]
freeze = [3.5, 4.5]   # screen dims, time freezes
burst = 4.5
rise = [4.6, 6.5]
card = 6.5
fakeout_allowed = false
fakeout_chance = 0.0
fakeout_window = [2.6, 3.0]

[multi_pull]
pod_interval = 0.35
full_sequence_for = "highest_rarity"
summary_grid = true

# SKIP / ENTER sit small in the bottom-right. Opacity is the prompt's alpha.
[hint]
text_px = 14.0
opacity = 0.60
margin_x = 28.0
margin_y = 22.0

# Title size is the shared LEGENDARY fit in [layout]. This is only the UI inset.
[card]
title_pad = 20.0
