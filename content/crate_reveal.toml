# Crate reveal visual timeline (seconds). Visual burst = sting hit time.
# The backend result is known before the drop. A fake-out may flicker at most one tier
# above the real one and must settle on the real tier. Skip jumps to the reveal card at any time.

# Global switch. Turn off for any paid crate. The backend logs each pull's fake-out decision.
fakeout_enabled = true
fakeout_sfx = "sfx/crate_fakeout.ogg"
burst_fade = 0.2                 # seconds the burst wash takes to fade
freeze_dim = 0.62                # legendary freeze multiplies the frame by 1 - this

[layout]
panel_width = 420.0
panel_height = 240.0
title_px = 42.0
hint_px = 16.0
glyph_rows = 7
row_gap = 16.0
ink_luma = 0.62
title_pad_px = 8
title_glyph_px = 6
title_height_div = 16
title_scale_min = 2
title_scale_max = 14
border_px = 8
border_mix = 0.42
gem_height = 0.30
gem_glow = 0.72
divider_px = 2
# Mix of the rule under the gem, the gem rim, and the crack glow.
divider_blend = 0.45
gem_edge_blend = 0.45
crack_glow_blend = 0.45
# Card rule width is the face times rule_num / rule_den.
rule_num = 2
rule_den = 3
# Dropped crate width is the frame width / crate_w_div, and at least crate_w_min.
crate_w_div = 6
crate_w_min = 12
# Crack rays leave the crate midline. reach scales with crack, hot is the core blend.
crack_reach = 0.62
crack_mid = 0.5
crack_hot_blend = 0.82
crack_rays = [
    [1.0, 0.0],
    [0.82, -0.42],
    [0.78, 0.48],
    [0.5, -0.82],
    [0.46, 0.88],
    [0.28, -0.12],
]
# Pixels kept between a failure line and the bottom edge of the frame.
failure_clear = 28.0
stage = "reveal_stage"
ink_dark = "reveal_ink"
ink_light = "reveal_paper"
# Still backdrop, in bytes: palette(stage) + stage_base + lift * center - vignette * corner.
# stage_y is the backdrop center as a fraction of the frame height.
stage_base = [-2.0, -2.0, -1.0]
stage_lift = [28.0, 22.0, 36.0]
stage_vignette = [10.0, 8.0, 12.0]
stage_y = 0.42
stage_lift_pow = 1.35
stage_vignette_pow = 1.6

[common]
rank = 1
tease = "sfx/crate_tease.ogg"
sting = "stings/crate_common.ogg"
drop = [0.0, 2.0]
crack = [2.0, 3.5]
burst = 3.5
rise = [3.6, 4.2]
card = 4.2
fakeout_allowed = false
fakeout_chance = 0.0
fakeout_window = [2.6, 3.0]

[rare]
rank = 2
tease = "sfx/crate_tease.ogg"
sting = "stings/crate_rare.ogg"
drop = [0.0, 2.0]
crack = [2.0, 3.5]
burst = 3.5
rise = [3.6, 5.0]
card = 5.0
fakeout_allowed = true
fakeout_chance = 0.15
fakeout_window = [2.6, 3.0]

[epic]
rank = 3
tease = "sfx/crate_tease.ogg"
sting = "stings/crate_epic.ogg"
drop = [0.0, 2.0]
crack = [2.0, 3.5]
burst = 3.5
rise = [3.6, 5.3]
card = 5.3
fakeout_allowed = true
fakeout_chance = 0.2
fakeout_window = [2.6, 3.0]

[legendary]
rank = 4
tease = "sfx/crate_tease_legendary.ogg"
sting = "stings/crate_legendary.ogg"
drop = [0.0, 2.0]
crack = [2.0, 3.5]
freeze = [3.5, 4.5]   # screen dims, time freezes
burst = 4.5
rise = [4.6, 6.5]
card = 6.5
fakeout_allowed = false
fakeout_chance = 0.0
fakeout_window = [2.6, 3.0]

[multi_pull]
pod_interval = 0.35
full_sequence_for = "highest_rarity"
summary_grid = true

# Item icon on a card face. The box is an integer fraction of the face.
# A cell is lit when row + col is below (rows + cols) / highlight_div.
[icon]
width_num = 3
width_den = 4
height_num = 2
height_den = 5
highlight_div = 3
highlight_blend = 0.45

# Ten-pull grid. columns * rows must equal banners.toml cost.pods.
# fast_flip is the gap between card ticks. The best card keeps its tier time.
[grid]
fast_flip = 0.125
columns = 5
rows = 2
gap = 18.0
card_w = 180.0
card_h = 112.0
back = "reveal_ink"
frame = "reveal_paper"
face = "reveal_paper"
refund_message = "REFUNDED"
refund_w = 760.0
refund_h = 620.0
refund_face = "reveal_paper"
refund_ink = "reveal_ink"
refund_tick = "ui_count_tick"
flip_cue = "crate_flip"
# Failed or replayed PULL AGAIN. The line is this paper color, under the buttons.
pull_failed = "ui_pull_failed"
failure_ink = "reveal_paper"
display = "roll"

# SKIP / ENTER sit small in the bottom-right. Opacity is the prompt's alpha.
[hint]
text_px = 14.0
opacity = 0.60
margin_x = 28.0
margin_y = 22.0

# Title size is the shared LEGENDARY fit in [layout]. This is only the UI inset.
[card]
title_pad = 20.0
