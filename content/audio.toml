# Mixer policy. Voice priority is nearest/loudest. Critical cues ignore the cap.
# Swarmers collapse into the single crowd id instead of one voice each.

voice_cap = 32
crowd_radius = 30.0
crowd_full_count = 18
min_distance = 0.5

# `loudness` is voice priority (nearest/loudest). `volume` is the playback
# mix level. Source files are not level-matched, so the mix never lives in code.
# `pitch` randomizes playback speed for that event. Absent entries stay at 1.0.

[[pitch]]
id = "shot"
min = 0.96
max = 1.045

