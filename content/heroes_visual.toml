# Meshy static casts. `file` is under assets/. A missing or unknown file fails at load.
# Rigged bodies, and the grip-origin guns from the rig handoff, are not in this set.
# `triangles` and `bytes` are the budgets. `size` is the fitted height or gun length.
# `at` places a body in front of the portrait camera, or a weapon's grip on that body.
# `view` is the grip in viewmodel space, before characters.toml viewmodel_offset.
# Gun grips sit on the +X butt. Brakk's shield grip is the handle.
# Colors are palette.toml keys. Empty `rim` means no rim light.
# `primary` `secondary` `accent` `fourth` are mask R G B A. They are not the UI
# `hero_<id>` keys. Empty `accent` or `fourth` means that channel has no weight.
# `shade` is the sRGB grayscale map. Channel rows do not carry `glow`; the tint
# does not read it. Bug rows still do. Emissive is a palette field, not this key.
# vex_body, vex_gun, and swarmer are in the handoff. Their task JSON was not,
# so `task` is empty and the source line records Meshy from Gorkasso's concepts.

