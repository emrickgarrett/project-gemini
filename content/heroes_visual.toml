# Full-body lobby meshes. characters.toml portrait.mesh names one of these ids,
# and every id here is a portrait. The portrait camera sits at the origin and
# looks down -Z. `place` shifts the body in front of that camera.
# A part color is a palette.toml key, or `accent` for that hero's accent_key.
# glow parts are unlit. A limb hangs along -Y from `at` before its own yaw and pitch.
# bevel is a chamfered box. arc is a vertical plate bowing toward +Z.

