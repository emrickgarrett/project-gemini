# Full-body lobby meshes. characters.toml portrait.mesh names one of these ids.
# The portrait camera sits at the origin and looks down -Z. `place` shifts the
# body in front of that camera. yaw_deg and pitch_deg on the portrait row turn it.
# A part color is a palette.toml key, or `accent` for that hero's accent_key.
# glow parts are unlit. size is the full box extent. A limb hangs along -Y from `at`
# before its own yaw and pitch. Every number lives in this file.

