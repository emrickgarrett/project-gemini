# Hitboxes and weak points (Gears). Weak points follow the named glow part in bugs_visual.toml via anchor; no fallback: content load fails if an anchor doesn't resolve. Independent of visible mesh. Units: meters, local space, +z forward, y up.
# Damage mult for body hits is 1.0; weak point mult listed here overrides waves.toml/bosses.toml if present.
[swarmer]
body = { shape = "sphere", radius = 0.35, offset = [0, 0.3, 0] }
weakpoint = { name = "abdomen", anchor = "abdomen", shape = "sphere", radius = 0.15, mult = 1.5 }

[spitter]
body = { shape = "capsule", radius = 0.4, height = 1.4, offset = [0, 0.8, 0] }
weakpoint = { name = "sac", anchor = "sac", shape = "sphere", radius = 0.32, mult = 2.0, grows_during_charge = 1.25 }
sac_pop_cancels_shot = true      # killing via sac during the 1.0s charge cancels the spit

[brute]
body = { shape = "box", half_extents = [0.8, 0.9, 1.1], offset = [0, 0.9, 0] }
weakpoint = { name = "cracks", anchor = "cracks", shape = "box", half_extents = [0.5, 0.3, 0.4], mult = 2.5, active_only_when = "vulnerable" }
armor_mult_when_closed = 0.5     # body damage while shell is closed
vulnerable_after_charge = 2.0    # cracks glow for 2s after its charge attack

[brood_mother]
body = { shape = "capsule", radius = 1.6, height = 4.0, offset = [0, 1.8, 0] }
weakpoint = { name = "gland", anchor = "gland", shape = "sphere", radius = 0.5 }   # mult in bosses.toml
pod = { shape = "sphere", radius = 0.35 }   # 6 pods; hp in bosses.toml

[hive_tyrant]
body = { shape = "capsule", radius = 2.0, height = 5.0, offset = [0, 2.5, 0] }
core = { anchor = "core", shape = "sphere", radius = 0.7 }        # mult per phase in bosses.toml
cannon = { shape = "sphere", radius = 0.6, anchor = "cannon" }      # phase 1 only
