[package]
name = "gemini-meshes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Procedural placeholder meshes. No renderer dependency."

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
gemini-sim = { path = "../sim" }

[dev-dependencies]
gemini-sim = { path = "../sim" }

[[bin]]
name = "bugshots"
path = "src/bin/bugshots.rs"

[[bin]]
name = "heroshot"
path = "src/bin/heroshot.rs"
