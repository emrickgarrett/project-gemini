[package]
name = "gemini-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Browser client. WebGPU build, with a separate WebGL2 build as fallback."
default-run = "gemini-client"

[features]
# Bevy's `webgpu` feature replaces `webgl2` at compile time, so the page
# ships two wasm artifacts and chooses at runtime. See web/index.html.
webgpu = ["bevy/webgpu"]
# Still renderer. Off by default so the wasm client build does not compile it.
pullshot = []
# Local stand-in host. Off by default, so the ordinary client build does not link the account crate.
dev-host = ["dep:gemini-server", "gemini-server/dev-host"]

[lib]
path = "src/lib.rs"

[dependencies]
gemini-sim = { path = "../sim" }
gemini-meshes = { path = "../meshes" }
gemini-proto = { path = "../proto" }
bevy = { version = "0.20", features = ["vorbis"] }
toml = "0.8"
gemini-server = { path = "../server", optional = true }
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Window", "Document", "EventTarget", "Performance", "Storage"] }

[[bin]]
name = "gemini-client"
path = "src/main.rs"

[[bin]]
name = "pullshot"
path = "src/bin/pullshot.rs"
required-features = ["pullshot"]
