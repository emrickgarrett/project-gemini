name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel older runs of the same ref. Pushes to main do not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: native client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libasound2-dev libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev ffmpeg
      - name: tests
        run: cargo test --workspace --no-fail-fast -- --skip vex_fp_stills_stay_near_the_polished_reference
      - name: vex reference drift
        run: cargo test -p gemini-meshes --bin bugshots -- vex_fp_stills_stay_near_the_polished_reference -- --nocapture
      - name: sim and client do not depend on backend
        run: |
          set -euo pipefail
          check() {
            local label="$1"
            shift
            if cargo tree "$@" -i gemini-backend --prefix none >"/tmp/tree.txt" 2>"/tmp/tree.err"; then
              echo "$label links gemini-backend"
              cat /tmp/tree.txt
              exit 1
            fi
            echo "$label does not link gemini-backend"
          }
          check "gemini-sim" -p gemini-sim
          check "default-features client" -p gemini-client
          if ! cargo tree -p gemini-client --features dev-host -i gemini-backend --prefix none >"/tmp/tree-dev.txt"; then
            echo "dev-host feature does not link gemini-backend"
            exit 1
          fi
          echo "dev-host is the only client feature that links gemini-backend"
          # Profiles do not change features. The release unit graph is the
          # fingerprint cargo writes for `cargo build --release`.
          rm -rf target/release/.fingerprint/gemini-client-*
          cargo build -p gemini-client --release
          python3 - << 'PY'
          import glob, json, os, sys
          def newest(pattern):
              paths = glob.glob(pattern)
              if not paths:
                  sys.exit(f"missing {pattern}")
              return max(paths, key=os.path.getmtime)
          def assert_clean(path, label):
              data = json.load(open(path))
              names = [dep[1] for dep in data.get("deps", [])]
              if "gemini_backend" in names:
                  sys.exit(f"{label} links gemini_backend: {names}")
              print(f"{label} does not link gemini_backend ({path})")
          assert_clean(newest("target/debug/.fingerprint/gemini-client-*/test-bin-gemini-client.json"), "default-features client")
          assert_clean(newest("target/release/.fingerprint/gemini-client-*/bin-gemini-client.json"), "release client")
          PY
          if cargo check -p gemini-client --release --features dev-host; then
            echo "release client compiled with dev-host"
            exit 1
          fi
          echo "release dev-host does not compile"
      - name: dev stand-in host
        run: cargo test -p gemini-server --features dev-host --lib -- --test-threads=8
      - name: backend does not build for wasm32
        run: |
          set +e
          cargo check -p gemini-backend --target wasm32-unknown-unknown
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "gemini-backend built for wasm32"
            exit 1
          fi
          echo "gemini-backend refused wasm32"
      - name: bugshots match committed stills
        run: |
          cargo run -p gemini-meshes --bin bugshots -- --out /tmp/bugshots-ci
          python3 - << 'PY'
          import subprocess, sys
          from pathlib import Path
          fresh = Path("/tmp/bugshots-ci")
          committed = Path("art/bugs")
          names = sorted(p.name for p in committed.glob("*.png"))
          got = sorted(p.name for p in fresh.glob("*.png"))
          if names != got:
              sys.exit(f"bugshot set mismatch\ncommitted {names}\nfresh {got}")
          def raw(path):
              return subprocess.check_output(
                  ["ffmpeg", "-v", "error", "-i", str(path), "-f", "rawvideo", "-pix_fmt", "rgb24", "-"],
              )
          for name in names:
              a = raw(committed / name)
              b = raw(fresh / name)
              if a != b:
                  sys.exit(f"{name} does not match a fresh bugshots render ({len(a)} vs {len(b)} bytes)")
          print(f"{len(names)} bugshots match")
          far = Path("art/bugs/at_15m")
          fresh_far = fresh / "at_15m"
          far_names = sorted(p.name for p in far.glob("*.png"))
          got_far = sorted(p.name for p in fresh_far.glob("*.png"))
          if far_names != got_far:
              sys.exit(f"arena still set mismatch\ncommitted {far_names}\nfresh {got_far}")
          for name in far_names:
              a = raw(far / name)
              b = raw(fresh_far / name)
              if a != b:
                  sys.exit(f"at_15m/{name} does not match a fresh bugshots render")
          print(f"{len(far_names)} arena stills match")
          PY
      - name: hero stills match committed pictures
        run: |
          cargo run -p gemini-meshes --bin heroshot -- --out /tmp/heroshot-ci
          python3 - << 'PY'
          import subprocess, sys
          from pathlib import Path
          names = ["vex_fp_idle.png", "vex_fp_overdrive.png"]
          def raw(path):
              return subprocess.check_output(
                  ["ffmpeg", "-v", "error", "-i", str(path), "-f", "rawvideo", "-pix_fmt", "rgb24", "-"],
              )
          for name in names:
              fresh = Path("/tmp/heroshot-ci") / name
              committed = Path("art/heroes") / name
              if not committed.is_file() or not fresh.is_file():
                  sys.exit(f"{name} missing from committed stills or a fresh heroshot render")
              a = raw(committed)
              b = raw(fresh)
              if a != b:
                  sys.exit(f"{name} does not match a fresh heroshot render ({len(a)} vs {len(b)} bytes)")
              if len(a) != 1280 * 720 * 3:
                  sys.exit(f"{name} is {len(a)} bytes, expected 1280x720 rgb")
          print("2 hero stills match")
          PY
      - name: wasm webgl2
        run: cargo build -p gemini-client --target wasm32-unknown-unknown --profile wasm-release
      - name: wasm webgpu
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: cargo build -p gemini-client --target wasm32-unknown-unknown --profile wasm-release --features webgpu
