[workspace]
resolver = "2"
members = [
    "crates/sim",
    "crates/proto",
    "crates/meshes",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

# Size-minded wasm profile. See README.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
